<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - จัดการเก็บเงิน</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="login-brand">
        <div class="login-brand-icon">🏫</div>
        <div>
          <div class="login-brand-title">จัดการเก็บเงิน</div>
          <div class="login-brand-sub">ห้องเรียน</div>
        </div>
      </div>

      <h1 id="form-title">เข้าสู่ระบบ</h1>

      <div id="message" class="message" style="display:none;"></div>

      <!-- ขั้นที่ 1: ใส่ username -->
      <form id="username-form" autocomplete="on">
        <label for="username">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               autocapitalize="off" spellcheck="false" placeholder="เช่น somchai">
        <button type="submit" id="username-btn">ถัดไป</button>
      </form>

      <!-- ขั้นที่ 2: ใส่ password (เฉพาะ admin / sup) -->
      <form id="password-form" style="display:none;" autocomplete="on">
        <div class="user-chip">
          <span class="user-chip-icon">👤</span>
          <span class="user-chip-text">
            <strong id="chip-username"></strong>
            <span id="chip-role" class="chip-role"></span>
          </span>
          <a href="#" id="change-user-link" class="chip-change">เปลี่ยน</a>
        </div>

        <!-- ช่อง username ซ่อนไว้ให้เบราว์เซอร์จำรหัสผ่านคู่กับ username ได้ถูกต้อง -->
        <input type="text" id="username-hidden" name="username" autocomplete="username" hidden>

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               placeholder="ใส่รหัสผ่าน">
        <button type="submit" id="password-btn">เข้าสู่ระบบ</button>
      </form>

      <p class="login-hint" id="login-hint">ผู้ใช้ทั่วไปใส่แค่ชื่อผู้ใช้ก็เข้าดูข้อมูลได้ทันที</p>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script src="session.js"></script>
  <script src="auth.js"></script>
</body>
</html>
